version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        platform:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: "github.com/kilip/opus/internal/auth"
              desc: "internal/platform must not import any feature"
            - pkg: "github.com/kilip/opus/internal/task"
              desc: "internal/platform must not import any feature"
            - pkg: "github.com/kilip/opus/internal/user"
              desc: "internal/platform must not import any feature"
            - pkg: "github.com/kilip/opus/internal/app"
              desc: "internal/platform must not import internal/app"
            - pkg: "github.com/kilip/opus/cmd"
              desc: "internal/platform must not import cmd"
            - pkg: "github.com/kilip/opus/ent"
              desc: "internal/platform must not import ent"

        feature-auth:
          list-mode: lax
          files:
            - "**/internal/auth/**"
            - "!$test"
          deny:
            - pkg: "github.com/kilip/opus/internal/task/"
              desc: "internal/auth must only import sibling feature root package, never subpackages"
            - pkg: "github.com/kilip/opus/internal/user/"
              desc: "internal/auth must only import sibling feature root package, never subpackages"
            - pkg: "github.com/kilip/opus/internal/app"
              desc: "features must not import internal/app"
            - pkg: "github.com/kilip/opus/cmd"
              desc: "features must not import cmd"

        feature-task:
          list-mode: lax
          files:
            - "**/internal/task/**"
            - "!$test"
          deny:
            - pkg: "github.com/kilip/opus/internal/auth/"
              desc: "internal/task must only import sibling feature root package, never subpackages"
            - pkg: "github.com/kilip/opus/internal/user/"
              desc: "internal/task must only import sibling feature root package, never subpackages"
            - pkg: "github.com/kilip/opus/internal/app"
              desc: "features must not import internal/app"
            - pkg: "github.com/kilip/opus/cmd"
              desc: "features must not import cmd"

        feature-user:
          list-mode: lax
          files:
            - "**/internal/user/**"
            - "!$test"
          deny:
            - pkg: "github.com/kilip/opus/internal/auth/"
              desc: "internal/user must only import sibling feature root package, never subpackages"
            - pkg: "github.com/kilip/opus/internal/task/"
              desc: "internal/user must only import sibling feature root package, never subpackages"
            - pkg: "github.com/kilip/opus/internal/app"
              desc: "features must not import internal/app"
            - pkg: "github.com/kilip/opus/cmd"
              desc: "features must not import cmd"

        feature-domain:
          list-mode: lax
          files:
            - "**/internal/*/domain/**"
          deny:
            - pkg: "github.com/gofiber/fiber"
              desc: "domain must not import fiber"
            - pkg: "github.com/kilip/opus/ent"
              desc: "domain must not import ent"
            - pkg: "github.com/kilip/opus/internal/platform/httpx"
              desc: "domain must not import httpx"
            - pkg: "github.com/kilip/opus/internal/*/repo"
              desc: "domain must not import repo"
            - pkg: "github.com/kilip/opus/internal/*/service"
              desc: "domain must not import service"
            - pkg: "github.com/kilip/opus/internal/*/handler"
              desc: "domain must not import handler"

        feature-repo:
          list-mode: lax
          files:
            - "**/internal/*/repo/**"
          deny:
            - pkg: "github.com/gofiber/fiber"
              desc: "repo must not import fiber"
            - pkg: "github.com/kilip/opus/internal/platform/httpx"
              desc: "repo must not import httpx"
            - pkg: "github.com/kilip/opus/internal/*/service"
              desc: "repo must not import service"
            - pkg: "github.com/kilip/opus/internal/*/handler"
              desc: "repo must not import handler"

        feature-service:
          list-mode: lax
          files:
            - "**/internal/*/service/**"
          deny:
            - pkg: "github.com/gofiber/fiber"
              desc: "service must not import fiber"
            - pkg: "github.com/kilip/opus/ent"
              desc: "service must not import ent"
            - pkg: "github.com/kilip/opus/internal/platform/httpx"
              desc: "service must not import httpx"
            - pkg: "github.com/kilip/opus/internal/*/handler"
              desc: "service must not import handler"

        feature-handler:
          list-mode: lax
          files:
            - "**/internal/*/handler/**"
            - "!$test"
          deny:
            - pkg: "github.com/kilip/opus/ent"
              desc: "handler must not import ent directly"
            - pkg: "github.com/kilip/opus/internal/*/repo"
              desc: "handler must not import repo directly"

        app:
          list-mode: lax
          files:
            - "**/internal/app/**"
          deny:
            - pkg: "github.com/kilip/opus/internal/auth/"
              desc: "internal/app must not import auth subpackages"
            - pkg: "github.com/kilip/opus/internal/task/"
              desc: "internal/app must not import task subpackages"
            - pkg: "github.com/kilip/opus/internal/user/"
              desc: "internal/app must not import user subpackages"
            - pkg: "github.com/kilip/opus/cmd"
              desc: "internal/app must not import cmd"

        cmd:
          list-mode: lax
          files:
            - "**/cmd/**"
          deny:
            - pkg: "github.com/kilip/opus/internal/auth/"
              desc: "cmd/opus must not import auth subpackages"
            - pkg: "github.com/kilip/opus/internal/task/"
              desc: "cmd/opus must not import task subpackages"
            - pkg: "github.com/kilip/opus/internal/user/"
              desc: "cmd/opus must not import user subpackages"

