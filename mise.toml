[tools]
air = "latest"
biome = "latest"
bun = "latest"
go = "latest"
golangci-lint = "latest"
node = "latest"
swag = "v2.0.0-rc6"

[tasks.dev]
depends = ["dev-api", "dev-ui"]

[tasks.dev-api]
run = "air"

[tasks.dev-ui]
dir = "ui"
run = "bun run dev"

[tasks.build-ui]
dir = "ui"
run = "bun run build"

[tasks.api-spec]
description = "Generate the OpenAPI 3.1 spec (api/swagger.json) from swag annotations"
run = "swag init --v3.1 -g main.go -d ./cmd/opus,./internal/app,./internal/platform/httpx,./internal/task/handler,./internal/task/domain,./internal/auth/handler,./internal/auth/domain --parseInternal --outputTypes json -o api"

[tasks.api-types]
description = "Generate ui/app/shared/api/schema.d.ts from the OpenAPI spec"
depends = ["api-spec"]
dir = "ui"
run = "bun run api:types"

[tasks.api]
description = "Regenerate the OpenAPI spec and the UI API types"
depends = ["api-types"]


[tasks.format]
description = "Format Go and UI code"
run = """
gofmt -w .
bunx --cwd ui biome check --write .
"""

[tasks.lint]
description = "Run Go and UI linters"
run = """
if [ -n "$(go list ./... 2>/dev/null)" ]; then
  test -z "$(gofmt -l .)"
  go vet ./...
  golangci-lint run
fi
bunx --cwd ui biome check .
bun run --cwd ui typecheck
"""

[tasks.test]
description = "Run Go and UI tests"
run = """
go test -race ./...
bun test --cwd ui --pass-with-no-tests
"""

[tasks.qc]
description = "Run format, lint, and test for UI and API"
run = """
mise run format
mise run lint
mise run test
"""
