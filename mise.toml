[tools]
air = "latest"
biome = "latest"
bun = "latest"
go = "latest"
golangci-lint = "latest"
node = "latest"
swag = "v2.0.0-rc6"

[tasks.dev]
depends = ["dev-api", "dev-ui"]

[tasks.dev-api]
run = "air"

[tasks.dev-ui]
dir = "ui"
run = "bun run dev"

[tasks.build-ui]
dir = "ui"
run = "bun run build"

[tasks.api-spec]
description = "Generate the OpenAPI 3.1 spec (api/swagger.json) from swag annotations"
run = "swag init --v3.1 -g main.go -d ./cmd/opus,./internal/app,./internal/platform/httpx,./internal/task/handler,./internal/task/domain,./internal/auth/handler,./internal/auth/domain,./internal/node/handler,./internal/node/domain,./internal/project/handler,./internal/project/domain,./internal/run/handler,./internal/run/domain,./internal/session/handler,./internal/session/domain,./internal/tracker/handler,./internal/tracker/domain --parseInternal --outputTypes json -o api"

[tasks.api-types]
description = "Generate ui/app/shared/api/schema.d.ts from the OpenAPI spec"
depends = ["api-spec"]
dir = "ui"
run = "bun run api:types"

[tasks.api]
description = "Regenerate the OpenAPI spec and the UI API types"
depends = ["api-types"]


[tasks.format]
description = "Format Go and UI code"
run = """
status=0
gofmt -w . || status=1
bunx --cwd ui biome check --write . || status=1
exit $status
"""

[tasks.lint]
description = "Run Go and UI linters"
run = """
status=0
if [ -n "$(go list ./... 2>/dev/null)" ]; then
  test -z "$(gofmt -l .)" || status=1
  go vet ./... || status=1
  golangci-lint run || status=1
fi
bunx --cwd ui biome check . || status=1
bun run --cwd ui typecheck || status=1
exit $status
"""

[tasks.test]
description = "Run Go and UI tests"
run = """
status=0
go test -race ./... || status=1
bun test --cwd ui --pass-with-no-tests || status=1
exit $status
"""

[tasks.qc]
description = "Run format, lint, and test for UI and API"
run = """
status=0
mise run format || status=1
mise run lint || status=1
mise run test || status=1
exit $status
"""
