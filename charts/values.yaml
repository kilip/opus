# Default values for opus.

global:
  # -- Registry prepended to image repository.
  imageRegistry: ghcr.io
  # -- Pull secrets for private registries, e.g. [{ name: ghcr }].
  imagePullSecrets: []

# -- Override chart name used in resource names.
nameOverride: ""
# -- Override full resource name prefix.
fullnameOverride: ""

# -- Number of replicas. SQLite requires a single replica (1).
replicaCount: 1

image:
  repository: kilip/opus
  # -- Defaults to chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

port: 7880

config:
  appName: opus
  host: 0.0.0.0
  logLevel: info
  readTimeout: 10s
  writeTimeout: 10s
  idleTimeout: 60s
  shutdownTimeout: 10s
  bodyLimit: 4194304

# -- Extra environment variables for container.
extraEnv: []

# -- Extra envFrom sources (ConfigMapRef / SecretRef).
extraEnvFrom: []

serviceAccount:
  # -- Create ServiceAccount for release.
  create: true
  # -- Name of ServiceAccount. Defaults to full name when create is true.
  name: ""
  annotations: {}
  # -- Mount ServiceAccount token.
  automountToken: false

service:
  type: ClusterIP
  port: 7880

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
persistence:
  # -- Enable persistence using Persistent Volume Claim.
  enabled: false
  # -- Storage class of the PVC.
  storageClass: ""
  # -- Size of data volume.
  size: 1Gi
  # -- Existing PVC name to use instead of creating one.
  existingClaim: ""
  # -- Annotations for the PVC.
  annotations: {}
  # -- Access mode for the PVC.
  accessModes:
    - ReadWriteOnce
  # -- Mount path for data volume.
  mountPath: /data


hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # distroless "nonroot" user has uid/gid 65532.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
