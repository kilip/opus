# Default values for opus.

global:
  # -- Registry prepended to image repository.
  imageRegistry: ghcr.io
  # -- Pull secrets for private registries, e.g. [{ name: ghcr }].
  imagePullSecrets: []

# -- Override chart name used in resource names.
nameOverride: ""
# -- Override full resource name prefix.
fullnameOverride: ""

# -- Number of replicas. SQLite requires a single replica (1).
replicaCount: 1

image:
  repository: kilip/opus
  # -- Defaults to chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

port: 7880

config:
  appName: opus
  host: 0.0.0.0
  # -- Canonical public base URL for OAuth callbacks.
  baseUrl: ""
  # -- Comma-separated list of allowed CORS / redirect origins.
  trustedOrigins: ""
  logLevel: info
  readTimeout: 10s
  writeTimeout: 10s
  idleTimeout: 60s
  shutdownTimeout: 10s
  bodyLimit: 4194304
  # -- Session duration / time-to-live.
  sessionTtl: 720h

auth:
  # -- Name of an existing Kubernetes Secret containing sensitive credentials.
  # When empty, the chart auto-generates <fullname>-auth with a random AUTH_SECRET
  # (reusing any existing secret on upgrade via Helm lookup).
  # Note: Argo CD users (which render via `helm template` without cluster lookup)
  # must set auth.existingSecret to avoid regenerating AUTH_SECRET on every sync.
  # Expected keys:
  #   - AUTH_SECRET: Secret key used to sign session cookies
  #   - APP_SMTP_PASSWORD: Password for SMTP authentication (when smtp.host is set)
  #   - AUTH_GITHUB_SECRET: OAuth client secret for GitHub (when oauth.github.clientId is set)
  #   - AUTH_GOOGLE_SECRET: OAuth client secret for Google (when oauth.google.clientId is set)
  #   - AUTH_FACEBOOK_SECRET: OAuth client secret for Facebook (when oauth.facebook.clientId is set)
  #   - NOTIFY_TELEGRAM_BOT_TOKEN: Telegram bot token (when notify.telegram.chatId is set)
  existingSecret: ""

github:
  # -- Name of an existing Kubernetes Secret containing GH_TOKEN for vibe runs.
  # Example: kubectl create secret generic opus-github --from-literal=GH_TOKEN=<token>
  existingSecret: ""

sentry:
  # -- Sentry DSN for error tracking.
  dsn: ""

tracker:
  # -- Interval between tracker sync polling cycles.
  pollInterval: 60s

notify:
  telegram:
    # -- Telegram chat ID for run.finished and node.offline alerts.
    chatId: ""

smtp:
  # -- SMTP server hostname.
  host: ""
  # -- SMTP server port.
  port: 587
  # -- SMTP username for authentication.
  username: ""
  # -- Sender email address for outgoing mail.
  from: ""

oauth:
  github:
    # -- GitHub OAuth client ID.
    clientId: ""
  google:
    # -- Google OAuth client ID.
    clientId: ""
  facebook:
    # -- Facebook OAuth client ID.
    clientId: ""

# -- Extra environment variables for container.
extraEnv: []

# -- Extra envFrom sources (ConfigMapRef / SecretRef).
extraEnvFrom: []

serviceAccount:
  # -- Create ServiceAccount for release.
  create: true
  # -- Name of ServiceAccount. Defaults to full name when create is true.
  name: ""
  annotations: {}
  # -- Mount ServiceAccount token.
  automountToken: false

service:
  type: ClusterIP
  port: 7880

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

persistence:
  # -- Enable persistence using Persistent Volume Claim.
  enabled: true
  # -- Storage class of the PVC.
  storageClass: ""
  # -- Size of data volume.
  size: 1Gi
  # -- Existing PVC name to use instead of creating one.
  existingClaim: ""
  # -- Annotations for the PVC.
  annotations: {}
  # -- Access mode for the PVC.
  accessModes:
    - ReadWriteOnce
  # -- Mount path for data volume.
  mountPath: /data

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # Nonroot user has uid/gid 65532.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
