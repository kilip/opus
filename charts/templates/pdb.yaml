{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
  name: {{ include "opus.fullname" . }}
  labels:
    {{- include "opus.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "opus.selectorLabels" . | nindent 6 }}
{{- end }}
