{{- if not .Values.auth.existingSecret }}
{{- $secretName := printf "%s-auth" (include "opus.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $authSecret := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "AUTH_SECRET") }}
  {{- $authSecret = index $existing.data "AUTH_SECRET" | b64dec }}
{{- else }}
  {{- $authSecret = randAlphaNum 48 }}
{{- end }}
{{/* Note: Argo CD users (`helm template`) must set auth.existingSecret because Helm `lookup` does not run during template rendering. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "opus.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ $authSecret | quote }}
{{- end }}
