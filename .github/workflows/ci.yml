name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        run: bunx biome lint .

      - name: Run typecheck
        run: bun run typecheck

      - name: Run UI tests
        run: bun test

      - name: Build UI bundle
        run: |
          bun run build
          test -z "$(find build/client -name '*.map')"

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go format
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Verify generated Ent code
        run: |
          go generate ./ent
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          cache-dependency-path: go.sum
          go-package: ./...

      - name: Run Go tests
        run: go test -v -race ./...

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          rm -f /tmp/kubeconform.tar.gz

      - name: Lint and validate Helm chart matrix
        run: |
          helm lint charts --strict
          helm template opus charts | kubeconform -strict -summary -
          for f in charts/ci/*.yaml; do
            echo "=== Testing $f ==="
            helm lint charts --strict -f "$f"
            helm template opus charts -f "$f" | kubeconform -strict -summary -
          done
          if helm template opus charts --set replicaCount=2 >/dev/null 2>&1; then
            echo "Expected replicaCount=2 to fail schema validation" >&2
            exit 1
          fi
          if helm template opus charts --set hpa.enabled=true >/dev/null 2>&1; then
            echo "Expected hpa.enabled=true to fail schema validation" >&2
            exit 1
          fi

  install-scripts:
    name: Install Scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint install.sh
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck scripts/install.sh

      - name: Test install.sh (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) os="linux" ;;
            Darwin) os="darwin" ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch="amd64" ;;
            aarch64|arm64) arch="arm64" ;;
          esac

          FIXTURE=$(mktemp -d)
          BIN_DIR=$(mktemp -d)
          trap 'rm -rf "$FIXTURE" "$BIN_DIR"' EXIT

          cat <<'EOF' > "$FIXTURE/opus"
          #!/usr/bin/env bash
          echo "opus version 0.0.0-test"
          EOF
          chmod 755 "$FIXTURE/opus"

          ARCHIVE="opus_0.0.0-test_${os}_${arch}.tar.gz"
          tar -C "$FIXTURE" -czf "$FIXTURE/$ARCHIVE" opus
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$FIXTURE" && sha256sum "$ARCHIVE" > checksums.txt)
          else
            (cd "$FIXTURE" && shasum -a 256 "$ARCHIVE" > checksums.txt)
          fi

          # Direct run + non-PATH export hint
          OUT=$(OPUS_VERSION=0.0.0-test OPUS_DOWNLOAD_BASE="file://$FIXTURE" OPUS_INSTALL_DIR="$BIN_DIR" bash scripts/install.sh)
          echo "$OUT" | grep -qF "0.0.0-test"
          echo "$OUT" | grep -qF "export PATH=\"$BIN_DIR:\$PATH\""

          # Piped run + upgrade (run twice)
          cat scripts/install.sh | OPUS_VERSION=0.0.0-test OPUS_DOWNLOAD_BASE="file://$FIXTURE" OPUS_INSTALL_DIR="$BIN_DIR" bash

          # Tampered archive must fail without overwriting binary
          rm -f "$BIN_DIR/opus"
          echo "tampered" >> "$FIXTURE/$ARCHIVE"
          if OPUS_VERSION=0.0.0-test OPUS_DOWNLOAD_BASE="file://$FIXTURE" OPUS_INSTALL_DIR="$BIN_DIR" bash scripts/install.sh; then
            echo "Expected tampered archive to fail" >&2
            exit 1
          fi
          [ ! -e "$BIN_DIR/opus" ]

      - name: Set up Go (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Smoke test opus service (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          SVC_DIR=$(mktemp -d)
          APP_HOME="$SVC_DIR/home"
          export APP_HOME
          mkdir -p "$APP_HOME"
          trap 'rm -rf "$SVC_DIR"' EXIT

          go build -o "$SVC_DIR/opus" ./cmd/opus
          "$SVC_DIR/opus" service install
          "$SVC_DIR/opus" service start
          "$SVC_DIR/opus" service status
          "$SVC_DIR/opus" service stop
          set +e
          "$SVC_DIR/opus" service status
          CODE=$?
          set -e
          [ "$CODE" -eq 3 ]
          "$SVC_DIR/opus" service uninstall
          [ -f "$APP_HOME/opus.env" ]

      - name: Set up Go (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run cmd/opus tests (Windows)
        if: matrix.os == 'windows-latest'
        run: go test ./cmd/opus/...

      - name: Smoke test opus service (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $svcDir = Join-Path $env:RUNNER_TEMP 'opus-svc'
          $appHome = Join-Path $svcDir 'home'
          New-Item -ItemType Directory -Path $appHome -Force | Out-Null
          $env:APP_HOME = $appHome

          $bin = Join-Path $svcDir 'opus.exe'
          go build -o $bin ./cmd/opus
          & $bin service install
          & $bin service start
          & $bin service status
          & $bin service stop
          & $bin service uninstall
          if (-not (Test-Path (Join-Path $appHome 'opus.env'))) {
            throw 'Expected opus.env to be preserved after uninstall'
          }

      - name: Test install.ps1 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'opus-fixture'
          $binDir = Join-Path $env:RUNNER_TEMP 'opus-bin'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null

          $src = Join-Path $fixture 'main.go'
          @'
          package main
          import "fmt"
          func main() { fmt.Println("opus version 0.0.0-test") }
          '@ | Set-Content -LiteralPath $src

          go build -o (Join-Path $fixture 'opus.exe') $src
          $archiveName = 'opus_0.0.0-test_windows_amd64.zip'
          $archivePath = Join-Path $fixture $archiveName
          Compress-Archive -LiteralPath (Join-Path $fixture 'opus.exe') -DestinationPath $archivePath -Force

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath (Join-Path $fixture 'checksums.txt')

          $env:OPUS_VERSION = '0.0.0-test'
          $env:OPUS_DOWNLOAD_BASE = ([Uri]$fixture).AbsoluteUri
          $env:OPUS_INSTALL_DIR = $binDir

          # Install twice (upgrade + idempotent PATH)
          & ./scripts/install.ps1
          & ./scripts/install.ps1

          $userParts = ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | Where-Object { $_ -eq $binDir }
          if ($userParts.Count -ne 1) {
            throw "Expected 1 User PATH entry for $binDir, got $($userParts.Count)"
          }

          # Tampered archive must fail
          Remove-Item -LiteralPath (Join-Path $binDir 'opus.exe') -Force
          Add-Content -LiteralPath $archivePath -Value 'tampered'
          $failed = $false
          try {
            & ./scripts/install.ps1
          } catch {
            $failed = $true
          }
          if (-not $failed) { throw 'Expected tampered archive to fail' }
          if (Test-Path (Join-Path $binDir 'opus.exe')) { throw 'Binary should not exist after failed checksum' }

          # Unsupported architecture must fail
          $env:PROCESSOR_ARCHITECTURE = 'ARM64'
          $env:PROCESSOR_ARCHITEW6432 = ''
          $archFailed = $false
          try {
            & ./scripts/install.ps1
          } catch {
            $archFailed = $true
          }
          if (-not $archFailed) { throw 'Expected ARM64 architecture to fail' }
