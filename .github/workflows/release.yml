name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ASPRI_CLIENT_ID }}
          private-key: ${{ secrets.ASPRI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please.json
          manifest-file: .github/release-manifest.json

      - name: Set up Bun
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.releases_created == 'true' }}
        uses: oven-sh/setup-bun@v2

      - name: Update custom CHANGELOG on release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_BRANCH="${{ fromJson(steps.release.outputs.pr).headBranchName }}"
          git fetch origin "${PR_BRANCH}"
          git checkout "${PR_BRANCH}"
          bun .github/scripts/generate-changelog.ts
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): update CHANGELOG.md"
            git push origin "${PR_BRANCH}"
          fi

      - name: Update GitHub Release notes
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bun .github/scripts/generate-changelog.ts --stdout > /tmp/release-notes.md
          gh release edit "${{ steps.release.outputs.tag_name }}" -F /tmp/release-notes.md
