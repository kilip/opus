name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ASPRI_CLIENT_ID }}
          private-key: ${{ secrets.ASPRI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please.json
          manifest-file: .github/release-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Bun
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.releases_created == 'true' }}
        uses: oven-sh/setup-bun@v2

      - name: Update custom CHANGELOG on release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_BRANCH="${{ fromJson(steps.release.outputs.pr).headBranchName }}"
          git fetch origin "${PR_BRANCH}"
          git checkout "${PR_BRANCH}"
          bun .github/scripts/generate-changelog.ts
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            FILE_SHA=$(gh api "repos/${{ github.repository }}/contents/CHANGELOG.md?ref=${PR_BRANCH}" --jq '.sha' 2>/dev/null || true)
            PR_BRANCH="${PR_BRANCH}" FILE_SHA="${FILE_SHA}" bun -e '
              const fs = require("fs");
              const content = fs.readFileSync("CHANGELOG.md").toString("base64");
              const payload = {
                message: "chore(release): update CHANGELOG.md",
                content,
                branch: process.env.PR_BRANCH,
                ...(process.env.FILE_SHA ? { sha: process.env.FILE_SHA } : {}),
              };
              process.stdout.write(JSON.stringify(payload));
            ' | gh api --silent --method PUT "repos/${{ github.repository }}/contents/CHANGELOG.md" --input -
          fi

      - name: Update GitHub Release notes
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bun .github/scripts/generate-changelog.ts --stdout > /tmp/release-notes.md
          gh release edit "${{ steps.release.outputs.tag_name }}" -F /tmp/release-notes.md
